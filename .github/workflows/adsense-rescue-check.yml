name: AdSense Rescue Build Check

on:
  push:
    branches:
      - adsense-rescue
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://quictools.cc
          NEXT_PUBLIC_ENABLE_PRO_PAYWALL: "false"
