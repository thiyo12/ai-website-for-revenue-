name: Repair Dokploy Dependency Lock

on:
  push:
    branches:
      - fix/dokploy-onnx-peer-lockfile-20261020

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use Docker-compatible npm version
        run: npm install -g npm@10.9.9
      - name: Add missing background-removal ONNX runtime and generate lockfile
        run: npm install --save-exact --package-lock-only --ignore-scripts onnxruntime-web@1.21.0
      - name: Verify package and lockfile have correct dependencies
        run: |
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(p.dependencies["onnxruntime-web"]!=="1.21.0" || !l.packages["node_modules/onnxruntime-web"])process.exit(1);console.log("ONNX dependency and peer resolution: OK")'
          git diff --check
      - name: Validate Docker-compatible clean install
        run: npm ci
      - name: Audit production dependencies
        run: node scripts/audit-production.mjs --enforce
      - name: Save candidate dependency manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dokploy-onnx-lock-repair
          path: |
            package.json
            package-lock.json
          retention-days: 7
